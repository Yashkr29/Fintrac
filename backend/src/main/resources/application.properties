spring.application.name=fintrac

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/fintrac?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=qwerty
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Configuration
server.port=8080

# JWT Configuration
jwt.secret=FintracSecretKeyForJWTTokenGeneration2024VeryLongAndSecureKey256Bits!!
jwt.expiration=86400000

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.fintrac=DEBUG
